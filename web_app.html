<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的口袋單字本 (Vocab Pocket)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D 翻卡效果 */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-between">

    <!-- 頂部標題與導覽 -->
    <header class="w-full max-w-md bg-indigo-600 text-white p-4 shadow-md rounded-b-2xl sticky top-0 z-30">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i class="fa-solid font-bold text-xl fa-book-bookmark text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-wide">口袋單字本</h1>
            </div>
            <span id="total-count-badge" class="bg-indigo-500/80 text-xs px-2.5 py-1 rounded-full font-medium border border-indigo-400">
                0 個單字
            </span>
        </div>

        <!-- 分頁切換鈕 -->
        <div class="flex mt-4 bg-indigo-700/50 p-1 rounded-xl text-sm font-medium">
            <button id="tab-list-btn" onclick="switchTab('list')" class="flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-700 shadow-sm font-semibold">
                <i class="fa-solid fa-list-ul mr-1.5"></i>單字列表
            </button>
            <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="flex-1 py-2 rounded-lg text-center transition-all text-indigo-100 hover:text-white">
                <i class="fa-solid fa-clone mr-1.5"></i>翻卡複習
            </button>
        </div>
    </header>

    <!-- 主體內容區塊 -->
    <main class="w-full max-w-md flex-1 p-4 mb-16 flex flex-col">

        <!-- ==================== 1. 單字列表分頁 ==================== -->
        <section id="view-list" class="space-y-4 flex-1 flex flex-col">
            
            <!-- 新增單字卡片 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">新增單字</h2>
                <form id="add-word-form" onsubmit="handleAddWord(event)" class="space-y-2.5">
                    <div>
                        <input type="text" id="input-english" placeholder="英文單字 (例: Apple)" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <div>
                        <input type="text" id="input-chinese" placeholder="中文釋義 (例: 蘋果)" required
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                    </div>
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-medium py-2.5 rounded-xl text-sm transition-all shadow-sm flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>加入單字庫</span>
                    </button>
                </form>
            </div>

            <!-- 搜尋列與篩選 -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" oninput="renderWordList()" placeholder="搜尋單字或中文..."
                    class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all shadow-sm">
            </div>

            <!-- 單字清單容器 -->
            <div class="flex-1 space-y-2.5 overflow-y-auto max-h-[50vh] pr-0.5" id="word-list-container">
                <!-- JavaScript 動態渲染單字卡片 -->
            </div>

            <!-- 空狀態示範 -->
            <div id="empty-state" class="hidden text-center py-10 px-4 space-y-3">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <p class="text-slate-500 text-sm">目前還沒有任何單字，趕快在上方新增吧！</p>
            </div>

        </section>

        <!-- ==================== 2. 翻卡複習分頁 ==================== -->
        <section id="view-quiz" class="hidden flex-1 flex flex-col items-center justify-center space-y-6 my-auto">
            
            <!-- 單字不夠時顯示提醒 -->
            <div id="quiz-empty-warning" class="text-center py-10 px-4 space-y-3 w-full">
                <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <p class="text-slate-600 text-sm font-medium">單字庫至少需要 1 個單字才能開始複習喔！</p>
                <button onclick="switchTab('list')" class="text-indigo-600 text-sm font-semibold hover:underline">
                    前往新增單字
                </button>
            </div>

            <!-- 翻卡主要區域 -->
            <div id="quiz-card-wrapper" class="w-full space-y-5 hidden">
                <!-- 進度指示 -->
                <div class="flex items-center justify-between text-xs text-slate-400 font-medium px-1">
                    <span id="quiz-progress-text">準備開始</span>
                    <span>點擊卡片可翻面查看釋義</span>
                </div>

                <!-- 3D 卡片主體 -->
                <div class="w-full h-64 perspective-1000 cursor-pointer" onclick="flipCard()">
                    <div id="flashcard" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-3xl bg-white border border-slate-100 flex items-center justify-center">
                        
                        <!-- 正面 (英文) -->
                        <div class="absolute inset-0 w-full h-full rounded-3xl p-6 backface-hidden flex flex-col items-center justify-center bg-gradient-to-br from-white to-slate-50 text-center border border-indigo-50">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full mb-3">ENGLISH</span>
                            <h2 id="card-english" class="text-3xl font-bold text-slate-800 break-all px-2">Word</h2>
                            
                            <!-- 發音按鈕 -->
                            <button onclick="event.stopPropagation(); speakCurrentWord()" class="mt-4 w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center hover:bg-indigo-100 active:scale-95 transition-all">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>

                        <!-- 背面 (中文) -->
                        <div class="absolute inset-0 w-full h-full rounded-3xl p-6 backface-hidden rotate-y-180 flex flex-col items-center justify-center bg-indigo-600 text-white text-center shadow-inner">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-500/60 text-indigo-100 rounded-full mb-3">CHINESE</span>
                            <h3 id="card-chinese" class="text-2xl font-bold break-all px-2">中文解釋</h3>
                        </div>

                    </div>
                </div>

                <!-- 底部抽題控制鈕 -->
                <div class="flex items-center space-x-3 pt-2">
                    <button onclick="nextQuizCard(false)" class="flex-1 py-3 bg-red-50 hover:bg-red-100 text-red-600 font-semibold rounded-2xl text-sm transition-all flex items-center justify-center space-x-1.5 active:scale-95">
                        <i class="fa-solid fa-xmark"></i>
                        <span>不熟練</span>
                    </button>
                    <button onclick="nextQuizCard(true)" class="flex-1 py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-semibold rounded-2xl text-sm transition-all flex items-center justify-center space-x-1.5 active:scale-95">
                        <i class="fa-solid fa-check"></i>
                        <span>已掌握</span>
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- 訊息提示 (Toast) -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">提示訊息</span>
    </div>

    <!-- JavaScript 邏輯處理 -->
    <script>
        // 全局狀態
        let vocabList = [];
        let currentTab = 'list';
        let currentQuizIndex = -1;
        let isCardFlipped = false;

        // 初始化
        window.onload = function() {
            loadVocabFromStorage();
            renderWordList();
        };

        // 從 LocalStorage 載入資料
        function loadVocabFromStorage() {
            const stored = localStorage.getItem('vocab_pocket_data');
            if (stored) {
                try {
                    vocabList = JSON.parse(stored);
                } catch (e) {
                    console.error("解析 LocalStorage 資料失敗", e);
                    vocabList = [];
                }
            } else {
                // 初次開啟預設範例單字
                vocabList = [
                    { id: Date.now() + 1, en: "Vocabulary", cn: "單字、詞彙", mastered: false },
                    { id: Date.now() + 2, en: "Practice", cn: "練習、實踐", mastered: false },
                    { id: Date.now() + 3, en: "Memory", cn: "記憶、回憶", mastered: false }
                ];
                saveVocabToStorage();
            }
            updateTotalBadge();
        }

        // 儲存至 LocalStorage
        function saveVocabToStorage() {
            localStorage.setItem('vocab_pocket_data', JSON.stringify(vocabList));
            updateTotalBadge();
        }

        // 更新頂部計數器
        function updateTotalBadge() {
            document.getElementById('total-count-badge').textContent = `${vocabList.length} 個單字`;
        }

        // 切換頁籤 (List vs Quiz)
        function switchTab(tab) {
            currentTab = tab;
            const listBtn = document.getElementById('tab-list-btn');
            const quizBtn = document.getElementById('tab-quiz-btn');
            const listView = document.getElementById('view-list');
            const quizView = document.getElementById('view-quiz');

            if (tab === 'list') {
                // 樣式切換
                listBtn.className = "flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-700 shadow-sm font-semibold";
                quizBtn.className = "flex-1 py-2 rounded-lg text-center transition-all text-indigo-100 hover:text-white";
                
                // 視圖切換
                listView.classList.remove('hidden');
                quizView.classList.add('hidden');
            } else {
                quizBtn.className = "flex-1 py-2 rounded-lg text-center transition-all bg-white text-indigo-700 shadow-sm font-semibold";
                listBtn.className = "flex-1 py-2 rounded-lg text-center transition-all text-indigo-100 hover:text-white";
                
                listView.classList.add('hidden');
                quizView.classList.remove('hidden');
                
                // 開始測驗模式
                startQuizMode();
            }
        }

        // 新增單字
        function handleAddWord(event) {
            event.preventDefault();
            const enInput = document.getElementById('input-english');
            const cnInput = document.getElementById('input-chinese');

            const en = enInput.value.trim();
            const cn = cnInput.value.trim();

            if (!en || !cn) return;

            const newWord = {
                id: Date.now(),
                en: en,
                cn: cn,
                mastered: false
            };

            vocabList.unshift(newWord); // 加入至最前面
            saveVocabToStorage();
            renderWordList();

            // 清空輸入框
            enInput.value = '';
            cnInput.value = '';
            enInput.focus();

            showToast("成功加入單字！", "success");
        }

        // 刪除單字
        function deleteWord(id) {
            vocabList = vocabList.filter(item => item.id !== id);
            saveVocabToStorage();
            renderWordList();
            showToast("單字已刪除", "info");
        }

        // 渲染單字列表
        function renderWordList() {
            const container = document.getElementById('word-list-container');
            const emptyState = document.getElementById('empty-state');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();

            container.innerHTML = '';

            // 過濾搜尋結果
            const filteredList = vocabList.filter(item => 
                item.en.toLowerCase().includes(searchKeyword) || 
                item.cn.toLowerCase().includes(searchKeyword)
            );

            if (filteredList.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredList.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between hover:border-indigo-100 transition-all";
                card.innerHTML = `
                    <div class="flex-1 pr-3">
                        <div class="flex items-center space-x-2">
                            <h3 class="font-bold text-slate-800 text-base">${escapeHtml(item.en)}</h3>
                            <button onclick="speakText('${escapeHtml(item.en)}')" class="text-slate-300 hover:text-indigo-600 transition-colors p-1">
                                <i class="fa-solid fa-volume-high text-xs"></i>
                            </button>
                        </div>
                        <p class="text-slate-500 text-sm mt-0.5">${escapeHtml(item.cn)}</p>
                    </div>
                    <button onclick="deleteWord(${item.id})" class="text-slate-300 hover:text-red-500 p-2 transition-colors rounded-lg">
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // ==================== 測驗卡片邏輯 ====================
        function startQuizMode() {
            const warning = document.getElementById('quiz-empty-warning');
            const wrapper = document.getElementById('quiz-card-wrapper');

            if (vocabList.length === 0) {
                warning.classList.remove('hidden');
                wrapper.classList.add('hidden');
                return;
            }

            warning.classList.add('hidden');
            wrapper.classList.remove('hidden');

            // 隨機選一個
            nextRandomQuizCard();
        }

        function nextRandomQuizCard() {
            // 重置翻牌狀態
            resetCardFlip();

            // 隨機選取單字
            const randomIndex = Math.floor(Math.random() * vocabList.length);
            currentQuizIndex = randomIndex;
            const item = vocabList[currentQuizIndex];

            // 填入內容
            document.getElementById('card-english').textContent = item.en;
            document.getElementById('card-chinese').textContent = item.cn;
            document.getElementById('quiz-progress-text').textContent = `隨機抽考中 (${vocabList.length} 個單字)`;
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isCardFlipped = !isCardFlipped;
            if (isCardFlipped) {
                card.classList.add('rotate-y-180');
            } else {
                card.classList.remove('rotate-y-180');
            }
        }

        function resetCardFlip() {
            const card = document.getElementById('flashcard');
            isCardFlipped = false;
            card.classList.remove('rotate-y-180');
        }

        function nextQuizCard(isMastered) {
            if (isMastered) {
                showToast("好棒！繼續保持！", "success");
            }
            // 延遲一下讓感受更順暢
            setTimeout(() => {
                nextRandomQuizCard();
            }, 150);
        }

        // 文字轉語音 (TTS)
        function speakCurrentWord() {
            if (currentQuizIndex >= 0 && vocabList[currentQuizIndex]) {
                speakText(vocabList[currentQuizIndex].en);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止先前的發音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 語速稍微放慢
                window.speechSynthesis.speak(utterance);
            } else {
                showToast("您的瀏覽器不支援語音朗讀", "info");
            }
        }

        // 提示訊息 Toast
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = message;

            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-indigo-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        // HTML 轉義字元防護 (XSS Safety)
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
